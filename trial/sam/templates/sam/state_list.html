<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State List</title>
</head>
<body>
    <h1>State List</h1>
    <ul>
        {% for state in states %}
            <li>{{ state.name }}</li>
        {% endfor %}

        <li><a href="{% url 'add_state' %}">Add New State</a></li>
        
    </ul>
</body>
</html>
