{% extends "sam/sam.html" %}

{% block title %}State List{% endblock %}

{% block content %}
<h1 class="mb-4">State List</h1>

<!-- Search input -->
<div class="mb-3">
    <input type="text" id="searchBox" class="form-control" placeholder="Search states...">
</div>

<!-- Initial list -->
<div id="stateList">
    {% include "sam/_state_list.html" %}
</div>

<a href="{% url 'add_state' %}" class="btn btn-primary mt-3">Add New State</a>

<script>
document.getElementById('searchBox').addEventListener('keyup', function() {
    let query = this.value;

    fetch(`/sam/state_list/?q=${encodeURIComponent(query)}`, {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(response => response.text())
    .then(html => {
        document.getElementById('stateList').outerHTML = html;
    });
});
</script>
{% endblock %}
