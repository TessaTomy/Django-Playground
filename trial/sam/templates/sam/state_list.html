<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State List</title>
</head>
<body>
    <h1>State List</h1>

    <!-- Search input -->
    <input type="text" id="searchBox" placeholder="Search states...">

    <!-- Initial list -->
    {% include "sam/_state_list.html" %}

    <a href="{% url 'add_state' %}">Add New State</a>

    <script>
    document.getElementById('searchBox').addEventListener('keyup', function() {
        let query = this.value;

        fetch(`/sam/state_list/?q=${query}`, {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(response => response.text())
        .then(html => {
            document.getElementById('stateList').outerHTML = html;
        });
    });
    </script>
</body>
</html>
