{% extends "sam/sam.html" %}

{% block title %}Student List{% endblock %}

{% block content %}
<h1 class="mb-4">Student List</h1>

<!-- Search input -->
<div class="mb-3">
    <input type="text" id="searchBox" class="form-control" placeholder="Search students...">
</div>

<!-- Student table -->
<div id="studentList">
    <table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>Photo</th><th>Name</th><th>State</th><th>District</th>
            <th>Age</th><th>Gender</th><th>Course</th><th>Actions</th>
        </tr>
    </thead>
    <tbody id="studentRows">
        {% include "sam/_student_list.html" %}
    </tbody>
</table>

</div>

<a href="{% url 'add_student' %}" class="btn btn-primary mt-3">Add New Student</a>

<script>

document.getElementById('searchBox').addEventListener('keyup', function() {
    let query = this.value;

    fetch(`/sam/student_list/?q=${encodeURIComponent(query)}`, {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
    .then(response => response.text())
    .then(html => {
        document.getElementById('studentRows').innerHTML = html;
    });
});


</script>
{% endblock %}
